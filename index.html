<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Balangoda Offline Map</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="./lib/maplibre-gl.css" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #map {
        background-color: #c3e7f4;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="./lib/pmtiles.js"></script>
    <script src="./lib/maplibre-gl.js"></script>
    <script>
      // Register PMTiles Protocol
      const protocol = new pmtiles.Protocol();
      maplibregl.addProtocol("pmtiles", protocol.tile);

      // Register Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
          try {
            await navigator.serviceWorker.register("sw.js");
            console.log("Service Worker registered.");
          } catch (err) {
            console.error("Service Worker registration failed:", err);
          }
        });
      }

      // Load local style.json
      fetch("./style.json")
        .then((res) => res.json())
        .then((style) => {
          const pmtilesUrl = new URL("balangoda.pmtiles", window.location.href)
            .href;

          // Point Shortbread source to local PMTiles file
          if (style.sources && style.sources["versatiles-shortbread"]) {
            style.sources["versatiles-shortbread"] = {
              type: "vector",
              url: "pmtiles://" + pmtilesUrl,
            };
          }

          // Initialize MapLibre Map
          const map = new maplibregl.Map({
            container: "map",
            style: style,
            center: [80.701561, 6.650622],
            zoom: 15,
            pitch: 65,
            bearing: -60,
            maxPitch: 85, // Allows max pitch up to 85 degrees
            attributionControl: false, // Custom attribution control added below
            hash: true,
          });

          // 1. Add Navigation Controls (Zoom in/out, Pitch/Rotation Reset)
          map.addControl(
            new maplibregl.NavigationControl({
              visualizePitch: true,
            }),
            "bottom-right",
          );

          // 2. Add High-Accuracy Geolocate Location Control (GPS Icon)
          const geolocateControl = new maplibregl.GeolocateControl({
            positionOptions: {
              enableHighAccuracy: true, // Forces precise GPS location
              timeout: 6000,
            },
            trackUserLocation: true, // Continually tracks user position
            showUserHeading: true, // Shows device orientation arrow
            showAccuracyCircle: true,
          });
          map.addControl(geolocateControl, "bottom-right");

          map.addControl(
            new maplibregl.ScaleControl({
              maxWidth: 100,
              unit: "metric",
            }),
            "bottom-left",
          );
          // 3. Add Fullscreen Control
          map.addControl(new maplibregl.FullscreenControl(), "top-right");

          // 4. Add Scale Control (Metric/Imperial indicator at bottom-left)
        })
        .catch((err) => console.error("Error loading style.json:", err));
    </script>
  </body>
</html>
